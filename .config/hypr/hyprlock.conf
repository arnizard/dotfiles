background {
    monitor =
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgba(235, 219, 178, 1.0)
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(254, 128, 25, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(254, 128, 25, 1.0)
    inner_color = rgba(40, 40, 40, 0.9)
    font_color = rgba(235, 219, 178, 1.0)
    check_color = rgba(250, 189, 47, 1.0)
    fail_color = rgba(251, 73, 52, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##928374">password</span>
    rounding = 10
    position = 0, -100
    halign = center
    valign = center
}